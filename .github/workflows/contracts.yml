name: contracts
on:
  push:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vv

  # Dry run of the fork test on a local chain-id 4663 node with canonical Uniswap v3 (no external RPC).
  fork-dry-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: |
          anvil --chain-id 4663 --silent &
          sleep 2
          forge script test/router/LocalRobinhood.s.sol --rpc-url http://127.0.0.1:8545 --broadcast \
            --private-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
          ROBINHOOD_RPC_URL=http://127.0.0.1:8545 FORK_CONFIG=cache/local-robinhood.json \
            forge test --match-contract Fork -vv

  # Real Robinhood Chain mainnet fork: live Uniswap v3, WETH, USDG and Stock Token.
  # Uses the ROBINHOOD_RPC_URL secret if set, otherwise the public (rate-limited) RPC.
  fork-robinhood:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test --match-contract Fork -vvv
